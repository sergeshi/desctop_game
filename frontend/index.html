<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop Detective</title><link rel="stylesheet" href="style.css"></head>
<body data-theme="mac"><div id="desktop">
<div class="menubar"><div class="menu-left"><span class="apple">◉</span><b>Finder</b><span>Файл</span><span>Правка</span><span>Вид</span><span>Окно</span></div><div class="menu-right"><span>♫</span><span>Wi-Fi</span><span id="menubar-clock">09:42</span></div></div>
<main class="workspace"><div class="desktop-shortcuts">
<button data-open="messages"><i class="ico mail">✉</i><span>Сообщения</span></button><button data-open="phone"><i class="ico phone">☎</i><span>Телефон</span></button><button data-open="mail"><i class="ico email">＠</i><span>Почта</span></button><button data-open="files"><i class="ico folder">▰</i><span>Файлы</span></button><button data-open="music"><i class="ico music">♫</i><span>Музыка</span></button><button data-open="browser"><i class="ico browser">◎</i><span>Браузер</span></button><button data-open="notes"><i class="ico notes">▤</i><span>Заметки</span></button><button data-open="case"><i class="ico case">⌕</i><span>Расследование</span></button></div>
<button class="developer-launch" data-open="studio" title="Режим разработки">⚒ <span>Режим разработки</span></button><div class="desktop-caption">DESKTOP DETECTIVE <small>CASE SYSTEM / 0.2</small></div></main>
<div id="windows"></div><div class="dock-wrap"><nav class="dock"><button data-open="messages">✉</button><button data-open="phone">☎</button><button data-open="mail">＠</button><button data-open="files">📁</button><button data-open="music">♫</button><button data-open="browser">◎</button><button data-open="notes">▤</button><button data-open="case">⌕</button><span class="dock-separator"></span><button data-open="settings">⚙</button><button data-open="studio" title="Режим разработки">⚒</button></nav></div>
<div id="notification-stack"></div><div id="incoming-call" class="call-overlay hidden"><div class="call-card"><div class="call-avatar">?</div><div class="call-kicker">ВХОДЯЩИЙ ВЫЗОВ</div><h2 id="caller-name">Неизвестный номер</h2><p id="caller-number">+31 ••• •• ••</p><div class="call-actions"><button id="decline-call" class="decline">✕</button><button id="answer-call" class="answer">☎</button></div><small>Ответить · Отклонить</small></div></div><div id="toast" class="toast"></div></div><script src="app.js"></script></body></html>
